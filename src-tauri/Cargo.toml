[package]
name = "maestro"
version = "0.1.0"
edition = "2021"
description = "Lightweight Tauri desktop agent with Rust-owned permissions and an auditable ledger."

[lib]
name = "maestro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
scraper = "0.23"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
rfd = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.23.1"
tree-sitter = "0.25.10"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
encoding_rs = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]

